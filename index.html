<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Multiverse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=Cinzel:wght@600;900&family=Cormorant+Garamond:ital,wght@1,500&family=Cormorant+SC:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --gold-hi: #fff3dd;
    --gold: #e9b36b;
    --gold-dim: #a8845a;
    --ember: #ff8a2a;
    --star: #ff79cf;
    --steel: #9fb4ff;
    --line: #e9b36b55;
    --ui: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
    --serif: "Cormorant SC", "Cormorant Garamond", Georgia, serif;
    background: #000;
  }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: var(--ui); color: var(--gold-hi); -webkit-font-smoothing: antialiased; user-select: none; }
  #film { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  body.playing #film { cursor: none; }
  .screen { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
  [hidden] { display: none !important; }

  /* ------------------------------------------------ opening card */
  #card {
    display: grid; place-items: center; align-content: center; gap: 18px; text-align: center;
    background: #000; transition: opacity 1.2s ease;
  }
  #card.gone { opacity: 0; }
  #card .emblem { width: 54px; height: 54px; opacity: 0; animation: cardIn 1.4s .2s ease forwards; }
  #card .kicker, #card .big { opacity: 0; animation: cardIn 1.4s ease forwards; }
  #card .kicker { font: 500 12px var(--ui); letter-spacing: .6em; margin-right: -.6em; text-transform: uppercase; color: var(--gold-dim); animation-delay: .5s; }
  #card .big { font: 600 clamp(20px, 2.4vw, 30px) var(--serif); letter-spacing: .32em; margin-right: -.32em; color: var(--gold-hi); animation-delay: .8s; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(6px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }

  /* ------------------------------------------------ title screen */
  #menu { position: fixed; inset: 0; z-index: 2; pointer-events: none; transition: opacity .9s ease; }
  #menu.gone { opacity: 0; visibility: hidden; transition: opacity .9s ease, visibility 0s .9s; }
  .pre {
    position: absolute; left: 0; right: 0; top: var(--pre-top, 18vh); text-align: center;
    font: 600 clamp(13px, 1.5vw, 22px) var(--serif); letter-spacing: .55em; margin-right: -.55em;
    color: #f1d6ad; text-shadow: 0 0 20px #ff8a2a55, 0 2px 10px #000;
    opacity: 0; transform: translateY(-6px); transition: opacity 1.4s ease, transform 1.4s ease;
  }
  #menu.titled .pre { opacity: 1; transform: none; }
  #titleSlot { position: absolute; left: 0; right: 0; top: var(--title-top, 22vh); height: var(--title-h, 12vh); }
  #quip {
    position: absolute; left: 16px; right: 16px; top: var(--quip-top, 40vh); margin: 0; text-align: center;
    font: italic 500 clamp(17px, 1.7vw, 24px) "Cormorant Garamond", Georgia, serif; color: #f7dcc6; text-shadow: 0 2px 12px #000;
    opacity: 0; transform: translateY(4px); transition: opacity .5s, transform .5s;
  }
  #quip.on { opacity: .95; transform: none; }

  .bottom {
    position: absolute; left: 16px; right: 16px; bottom: calc(max(5vh, 28px) + env(safe-area-inset-bottom, 0px));
    display: grid; justify-items: center; gap: clamp(14px, 2.4vh, 26px); pointer-events: auto;
  }
  .stack { display: grid; justify-items: center; }
  .stack > * { grid-area: 1 / 1; align-self: center; }
  #press {
    font: 600 13px var(--ui); letter-spacing: .6em; margin-right: -.6em; text-transform: uppercase; color: var(--gold-hi);
    text-shadow: 0 0 14px #ff8a2a; opacity: 0; transition: opacity .8s; pointer-events: none;
  }
  #menu.titled:not(.awake) #press { opacity: 1; animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .35; } }
  #loader { display: flex; align-items: center; gap: 14px; font: 500 11px var(--ui); letter-spacing: .32em; text-transform: uppercase; color: var(--gold-dim); transition: opacity .6s; }
  #menu:not(.awake) #loader { opacity: 0; }
  #loader.done { opacity: 0 !important; }
  #loader .spin { width: 16px; height: 16px; animation: spin 2.4s linear infinite; }
  #pct { font-variant-numeric: tabular-nums; color: #d7b58d; min-width: 3.5ch; text-align: right; }
  #status.error { color: #ff9a9a; letter-spacing: .04em; text-transform: none; font-size: 13px; }

  #options, #secondary, .rule { opacity: 0; transform: translateY(12px); transition: opacity .8s, transform .8s; pointer-events: none; }
  #menu.ready #options, #menu.ready #secondary, #menu.ready .rule { opacity: 1; transform: none; pointer-events: auto; }
  #menu.ready .rule { transition-delay: .15s; opacity: .8; }
  #menu.ready #secondary { transition-delay: .3s; }
  #options { display: flex; justify-content: center; gap: clamp(36px, 9vw, 160px); }
  .opt {
    position: relative; display: inline-flex; align-items: center; gap: .6em; padding: .3em .7em;
    background: none; border: 0; cursor: pointer; font: 700 clamp(26px, 3.1vw, 46px) var(--serif);
    letter-spacing: .34em; margin-right: -.34em; color: #d8c1a666; transition: color .35s, text-shadow .35s, transform .35s;
  }
  .opt .glyph {
    width: .42em; height: .42em; opacity: 0; transform: scale(.3) rotate(-90deg);
    background: radial-gradient(circle, #fff 0 22%, var(--gold) 64%);
    clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    transition: opacity .35s, transform .6s cubic-bezier(.2,.7,.1,1); filter: drop-shadow(0 0 6px var(--ember));
  }
  .opt.sel { color: var(--gold-hi); text-shadow: 0 0 18px #ff9a3c, 0 0 50px #ff7a2a88; transform: scale(1.05); }
  .opt.sel .glyph { opacity: 1; transform: scale(1); animation: spin 5s linear infinite; }
  #opt-no.sel { color: #e3eaff; text-shadow: 0 0 16px #6f8cff, 0 0 44px #3a4cff88; }
  #opt-no.sel .glyph { background: radial-gradient(circle, #fff 0 22%, var(--steel) 64%); filter: drop-shadow(0 0 6px #6f8cff); }
  .opt.shake { animation: shake .45s; }
  @keyframes shake { 20% { transform: translateX(-9px) } 40% { transform: translateX(8px) } 60% { transform: translateX(-5px) } 80% { transform: translateX(3px) } }
  @keyframes spin { to { transform: rotate(360deg); } }

  .rule { width: min(520px, 80vw); height: 9px; position: relative; }
  .rule::before { content: ""; position: absolute; left: 0; right: 0; top: 4px; height: 1px; background: linear-gradient(90deg, transparent, var(--line) 30%, var(--gold) 50%, var(--line) 70%, transparent); }
  .rule::after { content: ""; position: absolute; left: calc(50% - 4px); top: 0; width: 7px; height: 7px; transform: rotate(45deg); border: 1px solid var(--gold); background: #000; }

  #secondary { display: flex; justify-content: center; gap: clamp(18px, 4vw, 56px); }
  .sec {
    background: none; border: 0; cursor: pointer; padding: .5em .2em; position: relative;
    font: 600 clamp(12px, 1vw, 14px) var(--ui); letter-spacing: .42em; margin-right: -.42em; text-transform: uppercase;
    color: #bfa68a99; transition: color .3s;
  }
  .sec::after { content: ""; position: absolute; left: 0; right: .42em; bottom: .2em; height: 1px; background: var(--gold); transform: scaleX(0); transition: transform .35s; }
  .sec.sel, .sec:hover { color: var(--gold-hi); }
  .sec.sel::after { transform: scaleX(1); }
  .opt:focus-visible, .sec:focus-visible { outline: 1px dashed #ffffff55; outline-offset: 6px; }

  .hints {
    position: absolute; right: 24px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 18px; align-items: center;
    font: 500 11px var(--ui); letter-spacing: .2em; text-transform: uppercase; color: #9b856f; opacity: 0; transition: opacity .8s;
  }
  .hints.left { left: 24px; right: auto; }
  #menu.titled .hints.left, #menu.ready .hints { opacity: 1; }
  kbd {
    display: inline-grid; place-items: center; min-width: 1.9em; height: 1.9em; padding: 0 .4em; margin-right: .5em; box-sizing: border-box;
    font: 600 10px var(--ui); letter-spacing: .05em; color: #f3dcc0; border: 1px solid #e9b36b66; border-radius: 3px; background: #0008;
  }
  @media (max-width: 760px) { .hints { display: none; } }

  #menu.leaving .pre, #menu.leaving #quip, #menu.leaving .bottom, #menu.leaving .hints { transition: opacity .5s; opacity: 0 !important; }

  /* ------------------------------------------------ panels */
  #panel {
    position: fixed; inset: 0; z-index: 4; display: grid; place-items: center; padding: 16px;
    background: radial-gradient(ellipse at center, #0b0610c0, #000000ee); backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none; transition: opacity .45s;
  }
  #panel.on { opacity: 1; pointer-events: auto; }
  .frame {
    position: relative; width: min(1060px, 100%); max-height: calc(100vh - 64px); overflow: auto; box-sizing: border-box;
    padding: clamp(22px, 4vw, 44px); border: 1px solid #e9b36b33; background: linear-gradient(180deg, #120b09f2, #07050af2);
    box-shadow: 0 30px 120px #000, inset 0 0 80px #ff7a2a0d; transform: translateY(10px) scale(.985); transition: transform .45s cubic-bezier(.2,.7,.1,1);
  }
  #panel.on .frame { transform: none; }
  .frame::before, .frame::after { content: ""; position: absolute; width: 22px; height: 22px; border: 1px solid var(--gold); pointer-events: none; }
  .frame::before { left: 8px; top: 8px; border-right: 0; border-bottom: 0; }
  .frame::after { right: 8px; bottom: 8px; border-left: 0; border-top: 0; }
  .frame header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 26px; }
  .frame h2 { margin: 0; font: 700 clamp(26px, 3vw, 40px) var(--serif); letter-spacing: .24em; color: var(--gold-hi); }
  .frame .sub { margin-top: 4px; font: 500 12px var(--ui); letter-spacing: .3em; text-transform: uppercase; color: var(--gold-dim); }
  .back { flex: none; background: none; border: 1px solid #e9b36b55; color: var(--gold-hi); font: 600 11px var(--ui); letter-spacing: .3em; text-transform: uppercase; padding: .8em 1.4em; cursor: pointer; }
  .back:hover, .back:focus-visible { border-color: var(--gold); background: #e9b36b14; outline: none; }

  .chapters { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .chap {
    display: grid; gap: 6px; text-align: left; padding: 12px 12px 14px; cursor: pointer; background: #ffffff05; border: 1px solid #ffffff12;
    color: var(--gold-hi); font-family: var(--ui); transition: border-color .25s, background .25s, transform .25s;
  }
  .chap .sw { height: 56px; border-radius: 2px; margin-bottom: 4px; background: var(--sw); box-shadow: inset 0 0 0 1px #ffffff14, inset 0 -20px 30px #0006; }
  .chap .n { font: 600 11px var(--ui); letter-spacing: .3em; color: var(--gold-dim); font-variant-numeric: tabular-nums; }
  .chap .t { font: 600 19px var(--serif); letter-spacing: .08em; }
  .chap .tm { font: 500 11px var(--ui); letter-spacing: .15em; color: #9d8a78; font-variant-numeric: tabular-nums; }
  .chap:hover, .chap:focus-visible, .chap.sel { border-color: var(--gold); background: #e9b36b12; outline: none; transform: translateY(-2px); }

  .settings { display: grid; gap: 4px; }
  .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 20px; padding: 14px 16px; border: 1px solid transparent; }
  .row:hover, .row.sel { border-color: #e9b36b44; background: #e9b36b0d; }
  .row .l { font: 600 20px var(--serif); letter-spacing: .12em; }
  .row .d { font: 500 12px var(--ui); letter-spacing: .1em; color: #9d8a78; margin-top: 2px; }
  .choice { display: flex; align-items: center; gap: 10px; font: 600 13px var(--ui); letter-spacing: .26em; text-transform: uppercase; }
  .choice button { background: none; border: 0; color: var(--gold); cursor: pointer; font: 600 18px var(--ui); padding: 4px 10px; }
  .choice .v { min-width: 12ch; text-align: center; color: var(--gold-hi); }

  .credits { columns: 2 280px; column-gap: 44px; font: 400 14px/1.6 var(--ui); color: #d9c3ab; letter-spacing: .03em; user-select: text; }
  .credits h3 { break-after: avoid; margin: 0 0 6px; font: 600 12px var(--ui); letter-spacing: .32em; text-transform: uppercase; color: var(--gold-dim); }
  .credits section { break-inside: avoid; margin-bottom: 22px; }
  .credits p { margin: 0; }
  .credits .lead { font: 600 22px var(--serif); letter-spacing: .1em; color: var(--gold-hi); }

  @media (prefers-reduced-motion: reduce) {
    #card .emblem, #card .kicker, #card .big { animation-duration: .01s; }
    .opt.sel .glyph, #menu.titled #press, #loader .spin { animation: none; }
  }

  /* ------------------------------------------------ playback HUD */
  #hud {
    position: fixed; left: 16px; right: 16px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 1;
    display: flex; align-items: center; gap: 14px; font: 500 11px var(--ui); letter-spacing: .2em; text-transform: uppercase; color: #ffffffa0; transition: opacity .6s;
  }
  #hud.hidden { opacity: 0; pointer-events: none; }
  #scrub { flex: 1; height: 14px; display: flex; align-items: center; cursor: pointer; }
  #track { height: 2px; width: 100%; background: #ffffff22; }
  #fill { height: 100%; width: 0; background: var(--gold); }
  #shot { min-width: 140px; font: 600 15px var(--serif); letter-spacing: .15em; text-transform: none; color: var(--gold-hi); }
  #time, #res { font-variant-numeric: tabular-nums; color: #ffffff66; }
</style>
</head>
<body>
<canvas id="film"></canvas>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="star" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="46" fill="none" stroke="#e9b36b" stroke-width="1.4" opacity=".75"/>
      <circle cx="50" cy="50" r="40" fill="none" stroke="#e9b36b" stroke-width=".7" opacity=".5"/>
      <path d="M50 12 L59 39 L88 39 L64 56 L73 84 L50 67 L27 84 L36 56 L12 39 L41 39 Z" fill="none" stroke="#fff3dd" stroke-width="2"/>
      <circle cx="50" cy="50" r="3.5" fill="#ff79cf"/>
    </symbol>
  </defs>
</svg>

<div id="card" class="screen">
  <svg class="emblem"><use href="#star"/></svg>
  <div class="kicker">A real-time procedural film</div>
  <div class="big">Twenty worlds · Rendered live</div>
</div>

<div id="menu">
  <div class="pre" id="pre">Do you want to enter</div>
  <div id="titleSlot" role="heading" aria-level="1" aria-label="Do you want to enter the Multiverse?"></div>
  <p id="quip" aria-live="polite"></p>
  <div class="bottom">
    <div class="stack">
      <div id="press">Press any key</div>
      <div id="loader"><svg class="spin"><use href="#star"/></svg><span id="status">Opening the sanctum</span><span id="pct">0%</span></div>
      <nav id="options" aria-label="Enter the multiverse?">
        <button class="opt sel" id="opt-yes" data-choice="yes"><span class="glyph"></span><span class="label">Yes</span><span class="glyph"></span></button>
        <button class="opt" id="opt-no" data-choice="no"><span class="glyph"></span><span class="label">No</span><span class="glyph"></span></button>
      </nav>
    </div>
    <div class="rule"></div>
    <nav id="secondary" aria-label="More">
      <button class="sec" id="sec-chapters" data-panel="chapters">Chapters</button>
      <button class="sec" id="sec-settings" data-panel="settings">Settings</button>
      <button class="sec" id="sec-credits" data-panel="credits">Credits</button>
    </nav>
  </div>
  <div class="hints left"><span>Headphones recommended</span></div>
  <div class="hints"><span><kbd>←→</kbd>Choose</span><span><kbd>↑↓</kbd>Menu</span><span><kbd>Enter</kbd>Select</span><span><kbd>Esc</kbd>Back</span></div>
</div>

<div id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
  <div class="frame">
    <header>
      <div><h2 id="panelTitle">Chapters</h2><div class="sub" id="panelSub"></div></div>
      <button class="back" id="panelBack">Back</button>
    </header>
    <div id="p-chapters" class="chapters"></div>
    <div id="p-settings" class="settings"></div>
    <div id="p-credits" class="credits"></div>
  </div>
</div>

<div id="hud" class="hidden">
  <span id="shot"></span>
  <div id="scrub"><div id="track"><div id="fill"></div></div></div>
  <span id="time"></span>
  <span id="res"></span>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
