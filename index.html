<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiverse — a real-time procedural short</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: Inter, system-ui, sans-serif; color: #e8e2d8; }
  #film { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: none; }
  #overlay {
    position: fixed; inset: 0; display: grid; place-items: center; text-align: center;
    background: radial-gradient(ellipse at 50% 55%, #1a0610 0%, #050206 60%, #000 100%);
    transition: opacity 1.2s ease; z-index: 2;
  }
  #overlay.gone { opacity: 0; pointer-events: none; }
  .card { width: min(560px, calc(100vw - 32px)); }
  h1 {
    font-family: Cinzel, Georgia, serif; font-weight: 900; letter-spacing: .18em;
    font-size: clamp(34px, 8vw, 72px); margin: 0 0 6px;
    background: linear-gradient(180deg, #fff3de 0%, #f0b565 55%, #a4471a 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { font-size: 13px; letter-spacing: .38em; text-transform: uppercase; color: #b99c86; margin-bottom: 40px; }
  #start {
    font: 600 14px Inter, sans-serif; letter-spacing: .3em; text-transform: uppercase;
    color: #fff; background: transparent; border: 1px solid #f0a060; padding: 16px 36px; cursor: pointer;
    box-shadow: 0 0 40px #ff6a2033, inset 0 0 20px #ff6a2022; transition: all .3s;
  }
  #start:hover:not(:disabled) { background: #ff7a3022; box-shadow: 0 0 60px #ff6a2066, inset 0 0 30px #ff6a2044; }
  #start:disabled { opacity: .3; cursor: progress; }
  .progress { height: 1px; background: #ffffff18; margin: 28px auto 12px; width: 240px; }
  #bar { height: 100%; width: 0; background: #f0a060; transition: width .2s; }
  #status { font-size: 12px; color: #8f7f74; letter-spacing: .08em; min-height: 1.4em; }
  #status.error { color: #ff7a7a; white-space: pre-wrap; }
  .keys { margin-top: 36px; font-size: 11px; color: #6a5d55; letter-spacing: .06em; line-height: 1.9; }
  kbd { font: inherit; border: 1px solid #ffffff22; padding: 1px 6px; border-radius: 3px; color: #a08e80; }
  #hud {
    position: fixed; left: 16px; right: 16px; bottom: 14px; z-index: 1; display: flex; align-items: center; gap: 14px;
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #ffffffa0; transition: opacity .6s;
  }
  #hud.hidden { opacity: 0; }
  #scrub { flex: 1; height: 14px; display: flex; align-items: center; cursor: pointer; }
  #track { height: 2px; width: 100%; background: #ffffff22; }
  #fill { height: 100%; width: 0; background: #f0a060; }
  #shot { min-width: 120px; }
  #time, #res { font-variant-numeric: tabular-nums; color: #ffffff66; }
</style>
</head>
<body>
<canvas id="film"></canvas>
<div id="overlay">
  <div class="card">
    <h1>Multiverse</h1>
    <div class="sub">a real-time procedural short</div>
    <button id="start" disabled>Enter</button>
    <div class="progress"><div id="bar"></div></div>
    <div id="status">Opening the sanctum…</div>
    <div class="keys">
      <kbd>Space</kbd> pause &nbsp; <kbd>←</kbd><kbd>→</kbd> seek &nbsp; <kbd>F</kbd> fullscreen &nbsp; <kbd>Q</kbd> quality &nbsp; <kbd>M</kbd> mute &nbsp; <kbd>H</kbd> HUD
    </div>
  </div>
</div>
<div id="hud" class="hidden">
  <span id="shot"></span>
  <div id="scrub"><div id="track"><div id="fill"></div></div></div>
  <span id="time"></span>
  <span id="res"></span>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
